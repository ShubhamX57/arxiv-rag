[project]
name = "arxiv-rag"
version = "0.1.0"
description = "Production-grade RAG over ArXiv ML papers with hybrid retrieval, reranking, and proper evals"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["rag", "llm", "retrieval", "evals", "arxiv"]

dependencies = [
    # Ingestion
    "arxiv>=2.1.0",
    "pymupdf>=1.24.0",
    # Vector store
    "lancedb>=0.13.0",
    "pyarrow>=17.0.0",
    # Embeddings & reranking
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    # LLM abstraction
    "litellm>=1.50.0",
    # API & UI
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.40.0",
    # Config & CLI
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "typer>=0.12.0",
    "tqdm>=4.66.0",
    "python-dotenv>=1.0.0",
    # Data
    "numpy>=2.0.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
evals = [
    "ragas>=0.2.0",
    "datasets>=3.0.0",
]
observability = [
    "langfuse>=2.50.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
arxiv-rag = "arxiv_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_rag"]

# ---------- Linting / formatting ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501", # line too long (formatter handles it)
    "B008", # function calls in defaults (typer needs this)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts in tests are fine

# ---------- Type checking ----------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

# ---------- Testing ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=arxiv_rag",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests requiring external services",
]
